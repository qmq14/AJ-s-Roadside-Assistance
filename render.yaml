services:
  - type: web
    name: ajs-roadside-assistance
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ
        value: America/Detroit
      - key: DATA_DIR
        value: /var/data
    disk:
      name: ajs-data
      mountPath: /var/data
      sizeGB: 1
